# Copy to .github/workflows/reshoot.yml in an app with a versioned demo project.
# Records a candidate and uploads it with its review page; reads the repository but never changes it. Use it to
# check that CI can record the app, or where workflows may not open pull requests. refresh.yml opens one.
name: Record a demo candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Add app dependencies and synthetic fixture setup here.
      # The project config's [app] command must work from its own directory.

      - id: shoot
        uses: mumit/reshoot@305f5ebd94636edb118635b07509e8177cf4dab9 # v0.3.11; update deliberately
        with:
          config: demo/reshoot.toml # change: versioned project config

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reshoot-review
          path: demo/takes/ # change: project takes folder
          retention-days: 14
