# Tests reshoot on GitHub's runners: the test suite, then a whole shoot of the notes example through the action
# in this repo, the way a project would use it. The finished files are uploaded to look at; nothing is published.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Check the code compiles on the oldest Python it supports
        run: uvx --python 3.11 python -m compileall -q src tests
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core tesseract-ocr
          else brew install ffmpeg tesseract; fi
      - run: uv run --extra browser pytest --ocr-backend=tesseract
      - run: uv run --extra browser pytest -m browser --ocr-backend=tesseract
      - name: Install and run the built wheel outside the checkout
        env:
          RESHOOT_OCR: tesseract
        run: |
          uv build
          uv venv "$RUNNER_TEMP/reshoot-package"
          uv pip install --python "$RUNNER_TEMP/reshoot-package/bin/python" "$(ls ./dist/reshoot-*-py3-none-any.whl)[browser]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/reshoot-package/bin/reshoot" init packaged-demo
          "$RUNNER_TEMP/reshoot-package/bin/reshoot" skills codex --directory packaged-demo
          "$RUNNER_TEMP/reshoot-package/bin/reshoot" skills claude --directory packaged-demo
          "$RUNNER_TEMP/reshoot-package/bin/reshoot" doctor --config packaged-demo/reshoot.toml
          "$RUNNER_TEMP/reshoot-package/bin/reshoot" preview packaged-demo/reshoot.toml

  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: shoot
        uses: ./
        with:
          config: examples/notes/reshoot.toml
      - name: Show what the action reported
        if: always()
        run: |
          echo "ok=${{ steps.shoot.outputs.ok }} unchecked=${{ steps.shoot.outputs.unchecked }}"
          cat "${{ steps.shoot.outputs.report }}" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: notes-shoot
          path: takes/
          retention-days: 7
