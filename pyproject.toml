[project]
name = "reshoot"
version = "0.2.0"
description = "Agent skills and recording tools for repeatable software demo videos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.1",
    "websockets>=12",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
browser = ["playwright==1.58.0"]

[project.scripts]
reshoot = "reshoot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["browser: records a real page in headless Chrome (slow)"]
addopts = "-m 'not browser'"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "reshoot/bundled_skills"
