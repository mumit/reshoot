<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes, refreshed</title><link rel="stylesheet" href="../style.css"></head>
<body data-version="2"><main>
<header><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Notes, refreshed.</h1></div><span class="mark">N</span></header>
<form id="add"><input id="text" aria-label="Write a note" placeholder="Write a note" autocomplete="off"><button>Save note</button></form>
<div class="search"><span aria-hidden="true">⌕</span><input id="q" aria-label="Search notes" placeholder="Search notes" autocomplete="off"></div>
<div class="list-heading"><span id="count">3 notes</span><span class="local">Saved here</span></div>
<ul id="list"></ul><p class="empty" id="empty" hidden>No matching notes</p>
</main><script src="../app.js"></script></body></html>
