# Publishes a release to PyPI when a version tag such as v0.3.0 is pushed. The tag must match the version in
# pyproject.toml. Publishing uses PyPI trusted publishing, so no token is stored in the repository.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Check the code compiles on the oldest Python it supports
        run: uvx --python 3.11 python -m compileall -q src tests
      - name: Install ffmpeg and Tesseract
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core tesseract-ocr
      - run: uv run --extra browser pytest --ocr-backend=tesseract
      - run: uv build
      - name: Check the built package installs and runs
        run: |
          uv venv "$RUNNER_TEMP/check"
          uv pip install --python "$RUNNER_TEMP/check/bin/python" ./dist/*.whl
          "$RUNNER_TEMP/check/bin/reshoot" --version
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/check/bin/reshoot" init release-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reshoot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
