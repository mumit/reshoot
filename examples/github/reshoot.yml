# Legacy projects (no schema_version, with [keep]): records the demo video again on each release, and opens a pull
# request with the new files. For a versioned project, use refresh.yml instead.
# Copy this to .github/workflows/reshoot.yml in your project, and change the marked lines.
# The repo must let workflows open pull requests: Settings, Actions, General, "Allow GitHub Actions to create and
# approve pull requests".
#
# Nothing is published by this workflow. A person looks at the review sheets (in the run's
# "reshoot-review" artifact) and the new video, then merges the pull request or closes it.
name: Reshoot the demo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  reshoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Set up your app here, so that reshoot.toml's [app] run command works. For example:
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: npm ci

      - id: shoot
        uses: mumit/reshoot@719feaf4cc3faf383a085bb7203944c54fdd7728 # v0.3.5; update deliberately
        with:
          config: reshoot.toml   # change: where your shoot is

      # The takes, review sheets and report, for the person who reviews the pull request.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reshoot-review
          path: takes/            # change: your takes folder
          retention-days: 14

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        if: steps.shoot.outputs.ok == 'true'
        with:
          branch: reshoot/demo
          add-paths: docs/demo/   # change: where [keep] in reshoot.toml copies the finished files
          commit-message: "docs: reshoot the demo video"
          title: Reshoot the demo video
          body: |
            reshoot recorded the demo again from its scripts.

            **Before merging:** download the `reshoot-review` artifact from this run and look at every
            review sheet at full size. ${{ steps.shoot.outputs.unchecked }} images haven't been checked yet.
            The scan flagged ${{ steps.shoot.outputs.flagged }} as likely problems: they come first, boxed in red.
            Then watch the new video all the way through.
