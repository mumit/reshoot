# Records the notes example again on each release (or by hand), and opens a pull request with the new files in
# docs/demo/. reshoot's own copy of examples/github/reshoot.yml, so the example is tested for real.
#
# Nothing is published by this workflow. A person looks at the review sheets (in the run's
# "reshoot-review" artifact) and the new video, then merges the pull request or closes it.
name: Reshoot the demo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  reshoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: shoot
        uses: mumit/reshoot@main
        with:
          config: examples/notes/reshoot.toml

      # The takes, review sheets and report, for the person who reviews the pull request.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reshoot-review
          path: takes/
          retention-days: 14

      - uses: peter-evans/create-pull-request@v7
        if: steps.shoot.outputs.ok == 'true'
        with:
          branch: reshoot/demo
          add-paths: docs/demo/
          commit-message: "docs: reshoot the demo video"
          title: Reshoot the demo video
          body: |
            reshoot recorded the demo again from its scripts.

            **Before merging:** download the `reshoot-review` artifact from this run and look at every
            review sheet at full size. ${{ steps.shoot.outputs.unchecked }} images haven't been checked yet.
            The scan flagged ${{ steps.shoot.outputs.flagged }} as likely problems: they come first, boxed in red.
            Then watch the new video all the way through.
