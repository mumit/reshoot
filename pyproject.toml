[project]
name = "reshoot"
version = "0.3.0"
description = "Agent skills and recording tools for repeatable software demo videos"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mumit Khan" }]
keywords = ["demo", "video", "screencast", "readme", "gif", "agent-skills", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pillow>=10.1",
    "websockets>=12",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
browser = ["playwright==1.58.0"]

[project.urls]
Homepage = "https://github.com/mumit/reshoot"
Documentation = "https://github.com/mumit/reshoot/tree/main/guide"
Changelog = "https://github.com/mumit/reshoot/blob/main/CHANGELOG.md"
Issues = "https://github.com/mumit/reshoot/issues"

[project.scripts]
reshoot = "reshoot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

# PyPI cannot follow the README's relative links, so point them at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[(.*?)\]\((?!https?://)(.*?)\)'
replacement = '![\1](https://raw.githubusercontent.com/mumit/reshoot/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)\[(.*?)\]\((?!https?://|#)(.*?)\)'
replacement = '[\1](https://github.com/mumit/reshoot/blob/main/\2)'

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: records a real page in headless Chrome (slow)"]
addopts = "-m 'not browser'"

[tool.hatch.build.targets.sdist]
include = ["/src", "/skills", "/tests", "/examples/notes", "/.claude-plugin", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "reshoot/bundled_skills"
