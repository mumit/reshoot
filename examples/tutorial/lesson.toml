title = "Make a web app demo, then keep it current"
voice = "kokoro --voice af_heart --speed 1"
subtitle = "A practical reshoot workshop with the made-up notes app"
link = "github.com/mumit/reshoot"

[[scene]]
id = "welcome"
chapter = "Start with the result"
title = "A demo you can update"
takeaway = "One useful task. A clear result. A recording you can refresh."
text = "In this workshop, we turn one task in a web app into a short video, and a GIF you can put in the readme file. Then we change the app, and bring the video up to date. Everything uses the made up notes app and its synthetic data."

[[scene]]
id = "app"
chapter = "Start with the result"
title = "Choose one visible result"
takeaway = "Save a note, then find it by a word."
text = "Here is the task. Save a note that says, Pick up the bikes. Then search for bike, and find it. The notes app resets when the page reloads, so every recording starts the same way. Give your own app demo data that resets too."

[[scene]]
id = "command"
chapter = "Record your task"
title = "Point reshoot at the running app"
takeaway = "Start the app first, then give reshoot its address."
command = "reshoot create http://127.0.0.1:8765/ --directory demo"
text = "Start your app, then run reshoot create with its address. The directory is where the project lives. reshoot checks its tools, and opens a fresh browser for you to show the task."

[[scene]]
id = "write"
chapter = "Record your task"
title = "Show the task once"
takeaway = "Use demo data and show one task."
text = "Click Write a note, type Pick up the bikes, and press Enter. The toolbar at the bottom belongs to reshoot. It writes down each action, so it can repeat them later. Your timing doesn't need to be perfect."

[[scene]]
id = "save-check"
chapter = "Record your task"
title = "Name the result that matters"
takeaway = "Check the saved note, not an unrelated part of the page."
text = "Choose Check result, then click the saved note. Every recording now checks that the note really appears, and stops on this step if it doesn't."

[[scene]]
id = "search"
chapter = "Record your task"
title = "Show the next step"
takeaway = "Search for bike, and caption the result."
text = "Click Search notes and type bike. Choose Caption here, and write, Find the matching note. Keep captions short enough to read at a glance."

[[scene]]
id = "search-check"
chapter = "Record your task"
title = "Check the search result"
takeaway = "Keep checks that prove the task worked."
text = "Choose Check result again, and click the matching note. Keep only the checks that prove your task worked."

[[scene]]
id = "done"
chapter = "Record your task"
title = "Finish the demonstration"
takeaway = "Done saves the story and records its preview."
text = "Choose Done. reshoot saves the story, and records a preview by repeating your actions. In this workshop, a scripted hand drives the browser. The recording and its checks are real."

[[scene]]
id = "first-preview"
chapter = "Read your preview"
title = "Watch the first preview"
takeaway = "The MP4 and GIF come from the same saved story."
text = "Here is the first preview in the studio. The note is saved, and found again. reshoot added the cursor and the caption, and left out its toolbar. This is already a useful clip."

[[scene]]
id = "proof"
chapter = "Read your preview"
title = "Read the result checks"
focus = "right"
takeaway = "Passing checks prove the result happened."
text = "Choose Type search notes in the filmstrip. Its panel shows the checks that passed, its caption, and how long it holds. Checks prove the result happened. Whether the video explains it well is still your call."

[[scene]]
id = "story-files"
chapter = "Read your preview"
title = "Keep the source beside your app"
takeaway = "storyboard.toml: the task and its checks\nedit.toml: the cut and exports\nreshoot.toml: the project"
text = "The project is three plain files beside your app: the story, the edit, and the project settings. The studio saves your changes into them, so the next recording starts from your choices."

[[scene]]
id = "caption"
chapter = "Shape one moment"
title = "Make the caption clearer"
focus = "right"
takeaway = "A layout still shows a caption change right away."
text = "Change the caption to, A note found in a moment, and leave the field. A layout still shows the new words straight away. The video changes when you update it."

[[scene]]
id = "hold"
chapter = "Shape one moment"
title = "Give the result time to land"
focus = "right"
takeaway = "Hold result sets how long the result stays on screen."
text = "Set Hold result to 3 seconds, so the viewer has time to read. Undo and Redo work for every change, so try things freely."

[[scene]]
id = "update"
chapter = "Shape one moment"
title = "Update the preview"
takeaway = "Update preview records again only when it has to."
text = "Choose Update preview. A new hold means recording the task again. A caption alone would only need a quick re-cut. Then play just this step, to judge the pause."

[[scene]]
id = "replace-intro"
chapter = "Change a step by showing it"
title = "Replace one action by showing it"
focus = "right"
takeaway = "reshoot replays the steps before, then you show the change."
text = "Say bikes is a better search word. Open Change actions by showing them, and choose Replace this step's actions. reshoot opens a fresh browser, and replays the steps before this one."

[[scene]]
id = "replace-show"
chapter = "Change a step by showing it"
title = "Show the new action"
takeaway = "Done saves a draft. The story doesn't change yet."
text = "Type bikes into Search notes, and choose Done. This saves a draft. Your story doesn't change yet."

[[scene]]
id = "replace-review"
chapter = "Change a step by showing it"
title = "Review the draft"
focus = "right"
takeaway = "The caption, hold and checks stay."
text = "Back in the studio, compare Current actions with Proposed actions. Only the typed word changes. The caption, the hold, and the checks stay. Choose Use these actions, or Discard draft."

[[scene]]
id = "replace-verify"
chapter = "Change a step by showing it"
title = "Check the whole task again"
takeaway = "A fresh preview proves the new action works."
text = "Update the preview, to record the whole task with the new word, and check that it still works."

[[scene]]
id = "style"
chapter = "Add polish"
title = "Choose a look"
takeaway = "A look changes the presentation, not the task."
text = "Under Look, choose Midnight. A look sets the captions, the cards, and the browser frame. The task stays the same."

[[scene]]
id = "voice"
chapter = "Add polish"
title = "Add one spoken line"
focus = "right"
takeaway = "Narration can explain why a result matters."
text = "Open this step's Narration, and write, Find the note you saved by typing one of its words. Save it. The next recording waits for the line to finish."

[[scene]]
id = "card"
chapter = "Add polish"
title = "Open with a title"
focus = "right"
takeaway = "One short title is enough for this story."
text = "Add an opening card that says, Find a note in seconds. One short title is enough."

[[scene]]
id = "polished"
chapter = "Add polish"
title = "Watch the polished preview"
takeaway = "Judge words, pacing and sound in the video itself."
text = "Update the preview, and watch it. The card, the task, the caption, and the spoken line play together."

[[scene]]
id = "change"
chapter = "Keep the demo current"
title = "The app changes"
takeaway = "In the demo app only: q becomes note-search."
command = "# Demo app change\nid=\"q\"                 → id=\"note-search\"\nquerySelector(\"#q\")     → querySelector(\"#note-search\")"
text = "Now the app changes. In our copy, the search box's id goes from q to note-search, and the heading becomes, Notes, refreshed. A person can still do the task, but the story points at the old control."

[[scene]]
id = "refresh"
chapter = "Keep the demo current"
title = "Record the changed app"
takeaway = "After you change your app, choose Record app again."
text = "The studio can't see changes to a running app, so choose Record app again."

[[scene]]
id = "failure"
chapter = "Keep the demo current"
title = "Read the failure at its step"
takeaway = "The last good video stays."
text = "The recording stops at the search step, and says why. It can't find the search field as it was saved, and it suggests what that field probably is now. The last good video stays."

[[scene]]
id = "repair"
chapter = "Keep the demo current"
title = "Use the suggestion"
takeaway = "The typed words and the checks stay."
text = "Choose Use Search notes. reshoot changes how the step finds its field. The typed words and the checks stay. If a suggestion is wrong, Choose replacement in app lets you point at the right one."

[[scene]]
id = "verify"
chapter = "Keep the demo current"
title = "Record the repaired story"
takeaway = "Same task. Same checks. The new app."
text = "Update the preview. The repaired story passes its checks against the new app, heading and all."

[[scene]]
id = "compare"
chapter = "Keep the demo current"
title = "Compare two recordings"
takeaway = "Play the old and new recordings side by side."
text = "Under More tools, Compare plays the polished recording and the repaired one side by side. Pick a step to jump both to it."

[[scene]]
id = "final"
chapter = "Finish"
title = "Make the final"
takeaway = "Make final records the task again at full size."
text = "When the preview looks right, choose Make final. It records the task again at full size, and scans every export."

[[scene]]
id = "review"
chapter = "Finish"
title = "Review this recording"
takeaway = "Accepting is your decision, made on this exact recording."
text = "Watch the final video and the GIF, then read the scan. Accepting is your decision, made on this exact recording. This workshop leaves it to you."

[[scene]]
id = "sheets"
chapter = "Finish"
title = "Look at the scan sheets"
takeaway = "The scan points at possible problems. You decide."
text = "Open a scan sheet. Look for anything private, or hard to read, that the scan might have missed."

[[scene]]
id = "download"
chapter = "Finish"
title = "Download the exports"
takeaway = "One zip with every file from this recording."
text = "Download all exports gives you every file from this recording, in one zip. Downloading doesn't accept or publish anything."

[[scene]]
id = "own-app"
chapter = "Your app next"
title = "Bring your own task"
takeaway = "Start the app. Use demo data. Show one result."
command = "reshoot create YOUR_DEMO_URL --directory demo\n\n# Or try the notes app without starting a server\nreshoot create --recipe feature --directory notes-demo"
text = "For your app, start it with demo data, and give create its address. If it needs a login or setup, an agent can write the story with you. The written guide shows how."

[[scene]]
id = "close"
chapter = "Your app next"
title = "Make the next recording easier"
takeaway = "Keep the story. Refine a moment. Record again when the app changes."
text = "That's the whole loop. Show a task, check its result, shape it, and record again when the app changes. The written guide and the code are in the reshoot repository on GitHub."
